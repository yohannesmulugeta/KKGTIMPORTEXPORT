name: Optimize commodities image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-commodities.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert large commodities PNG to WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -q 78 -m 6 public/media/commodities-illustrative.png -o public/media/commodities-illustrative.webp
          test -s public/media/commodities-illustrative.webp
          ls -lh public/media/commodities-illustrative.png public/media/commodities-illustrative.webp
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/commodities-illustrative.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized commodities WebP"
          git pull --rebase origin main
          git push
